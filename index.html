<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0f0f1e">
    <title>CryptoHarvest</title>
    <link rel="manifest" href="manifest.json">
    <style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:linear-gradient(135deg,#0f0f1e 0%,#1a0033 100%);color:#e0e0ff}body{overflow-x:hidden}.container{max-width:1200px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}.header{background:rgba(15,15,30,.95);border-bottom:2px solid #00d4ff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}.logo{display:flex;align-items:center;font-size:1.5em;font-weight:bold;color:#00d4ff;gap:8px}.status-badge{padding:6px 12px;border-radius:20px;font-size:.85em;font-weight:bold;border:1px solid currentColor}.status-badge.active{background:#00d400;color:#0f0f1e}.status-badge.inactive{background:#666}.nav{display:flex;gap:24px;padding:0 20px;background:rgba(15,15,30,.5);border-bottom:1px solid rgba(0,212,255,.2);overflow-x:auto}.nav-button{background:0;border:0;color:#999;padding:16px 0;cursor:pointer;font-size:.95em;border-bottom:3px solid transparent;white-space:nowrap;transition:all .3s}.nav-button.active{color:#00d4ff;border-bottom-color:#00d4ff}.content{flex:1;padding:32px 20px}.section{display:none}.section.active{display:block;animation:slideIn .3s ease-out}@keyframes slideIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}.section-title{font-size:2em;margin-bottom:24px;color:#00d4ff;font-weight:bold}.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:32px}.stat-card{background:linear-gradient(135deg,rgba(0,212,255,.1),rgba(0,255,136,.05));border:1px solid rgba(0,212,255,.3);padding:20px;border-radius:12px}.stat-label{font-size:.9em;color:#999;text-transform:uppercase;margin-bottom:8px}.stat-value{font-size:1.6em;font-weight:bold;color:#00ff88}.button{padding:12px 24px;border:0;border-radius:8px;cursor:pointer;font-family:inherit;font-weight:bold;transition:all .3s;margin-bottom:12px}.button-primary{background:linear-gradient(135deg,#00d4ff,#00ff88);color:#0f0f1e}.button-primary:hover{transform:scale(1.05)}.button-danger{background:#d4003c;color:#fff}.button-secondary{background:rgba(0,212,255,.2);color:#00d4ff;border:1px solid rgba(0,212,255,.3)}.form-input{width:100%;padding:10px 12px;background:rgba(0,212,255,.1);border:1px solid rgba(0,212,255,.3);color:#e0e0ff;border-radius:6px;font-family:inherit;font-size:.95em;margin-bottom:8px}.list-item{background:rgba(0,212,255,.05);border:1px solid rgba(0,212,255,.2);border-radius:8px;padding:16px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap}.list-item-name{color:#00ff88;font-weight:bold}.list-item-meta{font-size:.85em;color:#999}.checkbox-label{display:flex;align-items:center;cursor:pointer;padding:8px 0}.checkbox-label input{margin-right:8px;cursor:pointer}.input-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}.autorun-section{background:rgba(0,212,255,.05);border:1px solid rgba(0,212,255,.2);border-radius:12px;padding:24px;margin-bottom:32px}.footer{text-align:center;padding:20px;border-top:1px solid rgba(0,212,255,.2);color:#666;font-size:.85em}</style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo"><span>⚡</span><span>CryptoHarvest</span></div>
            <div class="status-badge inactive" id="statusBadge">⚫ Остановлено</div>
        </div>

        <div class="nav">
            <button class="nav-button active" onclick="switchTab(event,'dashboard')">Dashboard</button>
            <button class="nav-button" onclick="switchTab(event,'faucets')">Faucets</button>
            <button class="nav-button" onclick="switchTab(event,'wallets')">Wallets</button>
            <button class="nav-button" onclick="switchTab(event,'settings')">Settings</button>
        </div>

        <div class="content">
            <div class="section active" id="dashboard">
                <h2 class="section-title">Панель управления</h2>
                <div class="stats-grid">
                    <div class="stat-card"><div class="stat-label">Доход</div><div class="stat-value" id="totalEarnings">$0.00</div></div>
                    <div class="stat-card"><div class="stat-label">BTC</div><div class="stat-value" id="btcEarnings">0.00</div></div>
                    <div class="stat-card"><div class="stat-label">ETH</div><div class="stat-value" id="ethEarnings">0.00</div></div>
                    <div class="stat-card"><div class="stat-label">LTC</div><div class="stat-value" id="ltcEarnings">0.00</div></div>
                </div>
                <div class="autorun-section">
                    <h3 style="color:#00d4ff;margin-bottom:16px">Автосбор</h3>
                    <button class="button button-primary" id="autoButton" onclick="toggleAuto()">▶️ Запустить</button>
                    <div id="enabledCount" style="color:#999;font-size:.9em;margin-top:12px"></div>
                </div>
            </div>

            <div class="section" id="faucets">
                <h2 class="section-title">Краны</h2>
                <div class="autorun-section">
                    <h3 style="color:#00d4ff;margin-bottom:16px">Добавить</h3>
                    <div class="input-grid">
                        <input type="text" class="form-input" id="newFaucetName" placeholder="Название">
                        <input type="text" class="form-input" id="newFaucetUrl" placeholder="URL">
                        <select class="form-input" id="newFaucetCrypto"><option>BTC</option><option>ETH</option></select>
                    </div>
                    <button class="button button-primary" onclick="addFaucet()">➕ Добавить</button>
                </div>
                <div id="faucetsList"></div>
            </div>

            <div class="section" id="wallets">
                <h2 class="section-title">Кошельки</h2>
                <div class="stat-card" style="margin-bottom:20px">
                    <input type="text" class="form-input" id="btcWallet" placeholder="BTC адрес" onchange="saveWallets()">
                    <input type="text" class="form-input" id="ethWallet" placeholder="ETH адрес" onchange="saveWallets()">
                    <input type="text" class="form-input" id="ltcWallet" placeholder="LTC адрес" onchange="saveWallets()">
                </div>
            </div>

            <div class="section" id="settings">
                <h2 class="section-title">Настройки</h2>
                <button class="button button-secondary" onclick="exportData()">📥 Экспорт</button>
                <button class="button button-danger" onclick="clearData()">🗑️ Очистить</button>
            </div>
        </div>

        <div class="footer"><p>CryptoHarvest v1.0 • 2026</p></div>
    </div>

    <script>
        let data = {
            faucets: [{id:1,name:'FreeBitco.in',url:'https://freebitco.in',crypto:'BTC',enabled:true},{id:2,name:'Moon Bitcoin',url:'https://moonbitcoin.io',crypto:'BTC',enabled:true}],
            earnings: {BTC:0,ETH:0,LTC:0,total:0},
            wallets: {BTC:'',ETH:'',LTC:''},
            autoRunning: false
        };

        function loadData() {
            const saved = localStorage.getItem('cryptoharvest');
            if (saved) Object.assign(data, JSON.parse(saved));
            updateUI();
        }

        function saveData() {
            localStorage.setItem('cryptoharvest', JSON.stringify(data));
        }

        function updateUI() {
            document.getElementById('totalEarnings').textContent = '$' + data.earnings.total.toFixed(2);
            document.getElementById('btcEarnings').textContent = data.earnings.BTC.toFixed(5);
            document.getElementById('ethEarnings').textContent = data.earnings.ETH.toFixed(5);
            document.getElementById('ltcEarnings').textContent = data.earnings.LTC.toFixed(5);

            document.getElementById('faucetsList').innerHTML = data.faucets.map(f => `
                <div class="list-item">
                    <div><div class="list-item-name">${f.name}</div><div class="list-item-meta">${f.url}</div></div>
                    <div style="display:flex;gap:12px">
                        <label class="checkbox-label"><input type="checkbox" ${f.enabled?'checked':''} onchange="toggleFaucet(${f.id})"> ${f.enabled?'✓':'✗'}</label>
                        <button class="button button-danger" style="padding:6px 10px" onclick="deleteFaucet(${f.id})">✕</button>
                    </div>
                </div>
            `).join('');

            document.getElementById('btcWallet').value = data.wallets.BTC;
            document.getElementById('ethWallet').value = data.wallets.ETH;
            document.getElementById('ltcWallet').value = data.wallets.LTC;

            document.getElementById('enabledCount').textContent = `Активно: ${data.faucets.filter(f=>f.enabled).length}`;
        }

        function switchTab(e, tab) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.getElementById(tab).classList.add('active');
            document.querySelectorAll('.nav-button').forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
        }

        function addFaucet() {
            const name = document.getElementById('newFaucetName').value;
            const url = document.getElementById('newFaucetUrl').value;
            if (name && url) {
                data.faucets.push({id:Date.now(), name, url, crypto:document.getElementById('newFaucetCrypto').value, enabled:true});
                document.getElementById('newFaucetName').value = '';
                document.getElementById('newFaucetUrl').value = '';
                saveData();
                updateUI();
            }
        }

        function deleteFaucet(id) {
            data.faucets = data.faucets.filter(f => f.id !== id);
            saveData();
            updateUI();
        }

        function toggleFaucet(id) {
            const f = data.faucets.find(f => f.id === id);
            if (f) { f.enabled = !f.enabled; saveData(); updateUI(); }
        }

        function toggleAuto() {
            data.autoRunning = !data.autoRunning;
            if (data.autoRunning) {
                setInterval(() => {
                    if (!data.autoRunning) return;
                    data.faucets.filter(f=>f.enabled).forEach(f => {
                        const crypto = f.crypto.split('/')[0];
                        data.earnings[crypto] = (data.earnings[crypto]||0) + Math.random()*0.00001;
                        data.earnings.total += Math.random()*0.0001;
                    });
                    updateUI();
                    saveData();
                }, 10000);
            }
            const btn = document.getElementById('autoButton');
            const badge = document.getElementById('statusBadge');
            if (data.autoRunning) {
                btn.textContent = '⏸️ Остановить';
                btn.className = 'button button-danger';
                badge.textContent = '🟢 Активно';
                badge.className = 'status-badge active';
            } else {
                btn.textContent = '▶️ Запустить';
                btn.className = 'button button-primary';
                badge.textContent = '⚫ Остановлено';
                badge.className = 'status-badge inactive';
            }
            saveData();
        }

        function saveWallets() {
            data.wallets = {BTC: document.getElementById('btcWallet').value, ETH: document.getElementById('ethWallet').value, LTC: document.getElementById('ltcWallet').value};
            saveData();
        }

        function exportData() {
            const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'cryptoharvest.json';
            a.click();
        }

        function clearData() {
            if (confirm('Очистить все?')) { localStorage.clear(); location.reload(); }
        }

        loadData();
        if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
    </script>
</body>
</html>
